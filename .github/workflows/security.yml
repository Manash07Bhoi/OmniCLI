name: Security & Pre-release Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 10.x

jobs:
  # ── Rust dependency audit ─────────────────────────────────────────────────
  rust-audit:
    name: Rust — cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: omnicli
        run: cargo audit

  # ── TypeScript / Node dependency audit ────────────────────────────────────
  npm-audit:
    name: Node — pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit Node dependencies
        # Fails the job on high or critical findings; moderate/low are reported
        # by `pnpm audit` without failing (the local gate in CONTRIBUTING runs
        # plain `pnpm audit`, which currently reports no findings at all).
        run: pnpm audit --audit-level=high

  # ── Rust licence check ────────────────────────────────────────────────────
  rust-deny:
    name: Rust — cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: omnicli/Cargo.toml
          command: check licenses advisories

  # ── Full TypeScript typecheck + build ─────────────────────────────────────
  # NOTE: the TypeScript typecheck/build gate lives in typescript.yml, which
  # also boots the API server and health-checks it. Duplicating it here made
  # every PR run the same install+build three times.
  # NOTE: the Rust formatting/clippy/test gate lives in rust.yml (including the
  # MSRV job); it is not repeated here so a PR runs it once.
