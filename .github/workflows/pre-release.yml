name: Pre-release Gate

on:
  # Runs automatically for every release tag and can be re-run manually. Without
  # the tag trigger this gate never ran before a release, which is how an
  # artifact layout that the installer could not consume shipped unnoticed.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.0)'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 10.x

jobs:
  # ── Enforce version consistency ───────────────────────────────────────────
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Cargo.toml version matches tag
        working-directory: omnicli
        env:
          # On a tag push `inputs` is empty, so fall back to the pushed ref.
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # The version lives in the binary crate manifest, not the workspace root.
          CARGO_VER=$(grep -m1 '^version' crates/omnicli-cli/Cargo.toml | head -1 | sed 's/.*= "\(.*\)"/\1/')
          if [ "v${CARGO_VER}" != "${TAG}" ]; then
            echo "::error::Cargo.toml version v${CARGO_VER} != tag ${TAG}"
            exit 1
          fi
          echo "Version ${CARGO_VER} matches tag ${TAG} ✓"

  # ── Cross-platform smoke test ─────────────────────────────────────────────
  smoke-matrix:
    name: Smoke — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            omnicli/target
          key: smoke-${{ matrix.os }}-${{ hashFiles('omnicli/Cargo.lock') }}
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y build-essential libssl-dev pkg-config
      - name: Build release
        working-directory: omnicli
        run: cargo build --release
      - name: Smoke tests
        working-directory: omnicli
        run: |
          ./target/release/omnicli --version
          ./target/release/omnicli --help
          ./target/release/omnicli file find --path . --count
          ./target/release/omnicli convert list
          ./target/release/omnicli config show
          ./target/release/omnicli dev uuid --count 1
          ./target/release/omnicli dev hash "pre-release-check" --algo blake3
          echo "All smoke tests passed ✓"

  # ── Full TypeScript gate ──────────────────────────────────────────────────
  ts-gate:
    name: TypeScript gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          PORT: '3000'
          BASE_PATH: '/'
          NODE_ENV: production
