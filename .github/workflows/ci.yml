name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 10.x

jobs:
  # ── Rust: cross-platform build & smoke ──────────────────────────────────────
  # The formatting, clippy and test gates for the Rust workspace live in
  # rust.yml (path-filtered, includes the MSRV job) so they are not run twice
  # on every push. This job adds what rust.yml does not cover: a release build
  # and a CLI smoke test on macOS and Windows.
  rust:
    name: Rust build & smoke — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: omnicli

      - name: Release build
        working-directory: omnicli
        run: cargo build --release

      - name: Smoke test — version
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./omnicli/target/release/omnicli.exe --version
          else
            ./omnicli/target/release/omnicli --version
          fi

      - name: Smoke test — commands
        if: runner.os != 'Windows'
        working-directory: omnicli
        run: |
          ./target/release/omnicli file find "*.toml" --count
          ./target/release/omnicli dev uuid --count 2
          ./target/release/omnicli dev hash "hello-omnicli" --algo blake3
          ./target/release/omnicli dev hash "hello-omnicli" --algo sha256
          ./target/release/omnicli convert list
          ./target/release/omnicli completions bash | head -5
          ./target/release/omnicli completions zsh  | head -5
          ./target/release/omnicli completions fish | head -5

  # ── Installer: end-to-end against a real packaged release ───────────────────
  # Packages the release binary in the published layout, publishes it over a
  # local HTTP server and installs it with the real scripts/install.sh. Covers
  # the happy path plus the three refusals that matter: wrong checksum, missing
  # checksum file and a path-traversal member.
  installer:
    name: Installer end-to-end (real archive, real install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: omnicli

      - name: Build release binary
        working-directory: omnicli
        run: cargo build --release

      - name: Run installer end-to-end test
        working-directory: omnicli
        run: ./scripts/test-installer.sh ./target/release/omnicli

  # NOTE: TypeScript typecheck/build and the API smoke test live in
  # typescript.yml; running them here as well tripled the install+build cost per
  # pull request with no extra coverage.
