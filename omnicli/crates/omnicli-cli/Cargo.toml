[package]
name = "omnicli-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Professional-grade, full-stack command-line toolkit for file ops, search, conversion, and archives."
repository = "https://github.com/Manash07Bhoi/OmniCLI"
readme = "../../README.md"
keywords = ["cli", "file", "search", "convert", "archive"]
categories = ["command-line-utilities"]

[[bin]]
name = "omnicli"
path = "src/main.rs"

[dependencies]
omnicli-core = { path = "../omnicli-core", version = "0.1.0" }
omnicli-file = { path = "../omnicli-file", version = "0.1.0" }
omnicli-search = { path = "../omnicli-search", version = "0.1.0" }
omnicli-archive = { path = "../omnicli-archive", version = "0.1.0" }
omnicli-convert = { path = "../omnicli-convert", version = "0.1.0" }
omnicli-dev = { path = "../omnicli-dev", version = "0.1.0" }
omnicli-workspace = { path = "../omnicli-workspace", version = "0.1.0" }
omnicli-backup = { path = "../omnicli-backup", version = "0.1.0" }
omnicli-config = { path = "../omnicli-config", version = "0.1.0" }

clap           = { workspace = true }
clap_complete  = { workspace = true }
age            = { workspace = true }
anyhow         = { workspace = true }
serde_json     = { workspace = true }
serde          = { workspace = true }
toml           = { workspace = true }
chrono         = { workspace = true }
tempfile       = { workspace = true }
rusqlite       = { workspace = true }
