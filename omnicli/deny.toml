[advisories]
yanked = "deny"
ignore = [
    # Build-time proc-macro from `age` 0.10's translations; no runtime path and
    # no release of age drops it yet. number_prefix was fixed by moving to
    # indicatif 0.18 (unit-prefix) instead of being ignored.
    "RUSTSEC-2024-0370",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "bzip2-1.0.6",  # bzip2 and libbzip2 license (BSD-style); pulled in by zip 8.x via libbz2-rs-sys
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
  { name = "openssl", reason = "use rustls instead; OpenSSL is a build-time pain on cross-compile targets" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
